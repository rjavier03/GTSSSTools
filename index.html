<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer Tools Menu</title>
<style>
:root {
  --bg:#071025;
  --panel:#0b1220;
  --muted:#94a3b8;
  --accent:#7dd3fc;
  --border: rgba(255,255,255,0.08);
  --text:#e6eef6;
  --output-bg:#020617;
}
html, body {
  height:100%;
  margin:0;
  background:linear-gradient(180deg,var(--bg),#071a2a);
  color:var(--text);
  font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.wrap {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:32px 24px;
  box-shadow:0 8px 30px rgba(2,6,23,.6);
  text-align:center;
  display:flex;
  flex-direction:column;
  height:90vh;
  box-sizing:border-box;
  width:calc(3 * 200px + 2 * 20px + 48px);
  max-width:100%;
}
h1 { margin-top:0; font-size:22px; color:var(--accent); }
p.lead { color:var(--muted); font-size:14px; margin-bottom:12px; }
input.search {
  padding:10px 12px;
  margin-bottom:20px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--output-bg);
  color:var(--text);
  font-size:14px;
  outline:none;
}
.section {
    overflow: auto;
}
.switch-container {
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:20px;
  gap:16px;
}
.switch-label {
  cursor:pointer;
  padding:6px 16px;
  border-radius:20px;
  background:var(--output-bg);
  transition: all 0.3s;
}
.switch-label.active { background:var(--accent); color:#000; }
.section { margin-bottom:20px; }
.menu {
  display:grid;
  grid-template-columns:repeat(3, 200px);
  gap:20px;
  overflow-y:auto;
  overflow-x:hidden;
  justify-content:center;
  align-items:start;
  transition: opacity 0.3s ease, max-height 0.3s ease;
}
.menu.hidden { opacity:0; max-height:0; overflow:hidden; }
.card {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:200px;
  min-height:100px;
  background:var(--output-bg);
  border-radius:12px;
  border:1px solid var(--border);
  color:var(--text);
  font-weight:600;
  font-size:15px;
  text-decoration:none;
  transition:transform 0.3s ease, box-shadow 0.3s ease;
  text-align:center;
  box-sizing:border-box;
  padding:10px;
  cursor:grab;
  position:relative;
}
.card.dragging { opacity:0.2; cursor:grabbing; }
.card:hover { 
  color:var(--accent);
  box-shadow:inset 0 0 20px rgba(125,211,252,0.15),0 0 10px rgba(125,211,252,0.2);
  transform:translateY(-3px);
}
.card button {
  margin-top:12px;
  padding:10px 16px;
  font-size:16px;
  border:none;
  border-radius:6px;
  font-weight:600;
  cursor:pointer;
  width:80%;
}
.card button.add-btn { background:var(--accent); color:#000; }
.card button.add-btn:hover { background:#5ac0e8; }
.card button.remove-btn { background:#ff5c5c; color:#fff; }
.card button.remove-btn:hover { background:#ff2a2a; }
footer { margin-top:12px; color:var(--muted); font-size:12px; flex-shrink:0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Developer Tools</h1>
  <p class="lead">Manage your tools</p>

  <input type="text" class="search" id="searchInput" placeholder="Search tools..." oninput="filterCards()">

  <div class="switch-container">
    <div class="switch-label active" id="myToolsSwitch" onclick="toggleView('myTools')">My Tools</div>
    <div class="switch-label" id="allToolsSwitch" onclick="toggleView('allTools')">All Tools</div>
  </div>

  <div class="section">
    <div class="menu" id="toolsMenu"></div>
  </div>

  <footer>© 2025 Developer Utilities</footer>
</div>

<script>
const tools = [
  {name:"XML Beautifier", href:"./xmlbeautifier.html"},
  {name:"Transaction Count Generator", href:"./transactioncount.html"},
  {name:"Translation Keyword Search", href:"./TranslationKeyWordSearch.html"},
  {name:"Simple PQ Command", href:"./PQSimleRestart.html"},
  {name:"Field Extract (EDIFact, CSV)", href:"./valueExtractor.html"},
  {name:"Requirement Template", href:"./RequirementTemplate.html"},
  {name:"Special Char Code Generator", href:"./SpecialCharCode.html"},
  {name:"Export Dev Template", href:"./TranslationExport.html"},
  {name:"Restore File Template", href:"./filerestore.html"},
  {name:"Invalid Char Checker", href:"./invalidcharchecker.html"},
  {name:"BlankDocs v1", href:"./BlankdocsV1.html"},
  {name:"FixField Extract", href:"./FixField.html"},
  {name:"JSON Validator", href:"./JSONValidator.html"},
  {name:"Code Checker v1", href:"./Code Checker/CodeChecker.html"},
  {name:"Simple OCR", href:"./SimpleOCR.html"},
  {name:"PDF View", href:"./PDFView.html"},
  {name:"Archived Ticket View", href:"./ArchiveTicketViewer.html"},
  {name:"Auto-refresh Ticketing", href:"./NewTicketNotifier.html"},
  {name:"XML Compare", href:"./XMLcompare.html"},
  {name:"Brady OCR Extraction", href:"./BradySteps.html"}

];

const toolsMenu = document.getElementById("toolsMenu");
let myTools = JSON.parse(localStorage.getItem("myTools")) || [];
let currentView = 'myTools';

function renderTools(){
  toolsMenu.innerHTML="";
  let list = currentView==='myTools' ? myTools : tools;

  list.forEach(tool=>{
    let card;
    if(currentView==='myTools'){
      card = document.createElement("a");
      card.className="card";
      card.href=tool.href;
      card.setAttribute("draggable","true");
      card.textContent=tool.name;
    } else { // allTools view
      card = document.createElement("div");
      card.className="card";
      card.textContent=tool.name;

      const existing = myTools.find(t=>t.href===tool.href);
      const btn = document.createElement("button");
      if(existing){
        btn.className="remove-btn";
        btn.textContent="Remove";
        btn.onclick = ()=> {
          myTools = myTools.filter(t=>t.href!==tool.href);
          saveMyTools();
          renderTools();
        };
      } else {
        btn.className="add-btn";
        btn.textContent="Add";
        btn.onclick = ()=>addToMyTools(tool);
      }
      card.appendChild(btn);
    }

    toolsMenu.appendChild(card);
  });

  if(currentView==='myTools') enableDrag(toolsMenu);
}

function addToMyTools(tool){
  if(!myTools.find(t=>t.href===tool.href)){
    myTools.push(tool);
    saveMyTools();
    renderTools();
  }
}

function saveMyTools(){ localStorage.setItem("myTools", JSON.stringify(myTools)); }

function toggleView(view){
  currentView=view;
  document.getElementById('myToolsSwitch').classList.toggle('active', view==='myTools');
  document.getElementById('allToolsSwitch').classList.toggle('active', view==='allTools');
  renderTools();
}

// --- Search ---
function filterCards(){
  const filter=document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.menu .card').forEach(card=>{
    const text=card.textContent.toLowerCase();
    card.style.display=text.includes(filter) ? "flex" : "none";
  });
}

// --- Drag for My Tools ---
function enableDrag(container){
  let draggedEl=null;
  let currentTarget=null;

  container.addEventListener('dragstart', e=>{
    if(!e.target.classList.contains('card')) return;
    draggedEl=e.target;
    draggedEl.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setDragImage(new Image(),0,0);
  });

  container.addEventListener('dragover', e=>{
    e.preventDefault();
    if(!draggedEl) return;
    const after=getClosestCard(container,e.clientX,e.clientY);
    if(after && after!==currentTarget){
      currentTarget=after;
      container.insertBefore(draggedEl, after);
    } else if(!after && container.lastElementChild!==draggedEl){
      container.appendChild(draggedEl);
    }
  });

  container.addEventListener('dragend', ()=>{
    if(draggedEl) draggedEl.classList.remove('dragging');
    draggedEl=null;
    currentTarget=null;
    saveMyTools();
  });
}

function getClosestCard(container,x,y){
  const cards=[...container.querySelectorAll('.card:not(.dragging)')];
  let closest=null,minDist=Infinity;
  for(const card of cards){
    const rect=card.getBoundingClientRect();
    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;
    const dist=Math.hypot(x-cx,y-cy);
    if(dist<minDist){ minDist=dist; closest=card; }
  }
  return closest;
}

// initial render
renderTools();
</script>
</body>
</html>
