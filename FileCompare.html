<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Multi File Comparator Pro</title>
    <style>
         :root {
            --bg: #071025;
            --panel: #0b1220;
            --muted: #94a3b8;
            --accent: #7dd3fc;
            --border: rgba(255, 255, 255, 0.08);
            --text: #e6eef6;
        }
        
        html,
        body {
            height: 100%;
            margin: 0;
            background: linear-gradient(180deg, var(--bg), #071a2a);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, sans-serif;
        }
        
        .wrap {
            max-width: 1200px;
            margin: 20px auto;
            padding: 24px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(2, 6, 23, .6);
        }
        
        header h1 {
            color: var(--accent);
            margin: 0 0 15px 0;
            font-size: 22px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            cursor: default;
            user-select: none;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .step {
            background: #031022;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        
        .step h3 {
            color: var(--accent);
            margin: 0 0 6px 0;
            font-size: 15px;
        }
        
        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #020617;
            color: var(--text);
            box-sizing: border-box;
            margin-top: 4px;
            font-family: monospace;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        button {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: #1e293b;
            color: white;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #334155;
        }
        
        button.primary {
            background: linear-gradient(180deg, #007b8f, #006a7a);
            font-weight: bold;
            flex: 2;
            border: none;
        }
        
        button.danger {
            background: linear-gradient(180deg, #991b1b, #7f1d1d);
            flex: 1;
            border: none;
        }
        
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        pre {
            background: #020617;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            max-height: 550px;
            overflow: auto;
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.4;
            margin: 0;
        }
        
        .diff-group {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
        
        .orphan-notice {
            background: rgba(248, 113, 113, 0.05);
            border-left: 3px solid #f87171;
            padding: 6px 10px;
            margin-bottom: 6px;
            color: #fca5a5;
            font-size: 12px;
        }
        
        .diff-add {
            color: #4ade80;
            display: block;
            padding-left: 5px;
        }
        
        .diff-remove {
            color: #f87171;
            display: block;
            padding-left: 5px;
        }
        
        .diff-path-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(125, 211, 252, 0.04);
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        
        .diff-path {
            color: var(--accent);
            font-weight: 600;
            font-size: 12px;
        }
        /* MODALS */
        
        #waitingOverlay,
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            color: white;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
        }
        
        .modal-box {
            background: #0b1220;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--accent);
            text-align: center;
            box-shadow: 0 0 20px rgba(125, 211, 252, 0.2);
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>

<body>

    <div id="waitingOverlay"></div>

    <div id="codeModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin:0 0 15px 0">Bypass Protocol</h3>
            <input type="password" id="codeInput" placeholder="Enter Code">
            <div class="btn-group">
                <button class="primary" onclick="checkCode()">Submit</button>
                <button onclick="closeModal('codeModal')">Cancel</button>
            </div>
        </div>
    </div>

    <div id="formatterModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin:0 0 10px 0">ID Formatter</h3>
            <p style="font-size:12px; color:var(--muted); margin-bottom:10px;">Paste IDs below. New lines will auto-convert to commas.</p>
            <textarea id="formatterInput" rows="8" placeholder="Paste list here..." oninput="autoFormat(this)"></textarea>
            <div class="btn-group">
                <button class="primary" onclick="copyFormatterResult()">Copy Result</button>
                <button onclick="closeModal('formatterModal')">Close</button>
            </div>
        </div>
    </div>

    <div class="wrap">
        <header>
            <h1 id="title">Multi File Comparator Pro</h1>
        </header>
        <div class="grid">
            <div class="step">
                <h3>PROD Files</h3>
                <input type="file" id="prodFiles" multiple>
            </div>
            <div class="step">
                <h3>TEST Files</h3>
                <input type="file" id="testFiles" multiple>
            </div>
        </div>

        <div class="step">
            <h3>Mode & Action</h3>
            <select id="mode">
                <option value="xml">XML (Nodes & Values)</option>
                <option value="line">Line by Line (Skip Header)</option>
                <option value="json">JSON (Structure & Path)</option>
                <option value="edi">EDIFACT (Segment & Field)</option>
            </select>
            <div class="btn-group">
                <button class="primary" onclick="processFiles()">Run Comparison</button>
                <button onclick="openModal('formatterModal')">Format IDs</button>
                <button class="danger" onclick="triggerReset()">Reset All</button>
            </div>
        </div>

        <div class="step">
            <div class="output-header">
                <h3>Output Report</h3>
                <button onclick="copyAllResults()">Copy All Results</button>
            </div>
            <div id="outputContainer">
                <pre id="output">Results will appear here...</pre>
            </div>
        </div>
    </div>

    <script>
        const Storage = {
            set: function(key, value, seconds) {
                const item = {
                    value: value,
                    expiry: seconds ? Date.now() + (seconds * 1000) : null
                };
                localStorage.setItem(key, JSON.stringify(item));
            },
            get: function(key) {
                const itemStr = localStorage.getItem(key);
                if (!itemStr) return null;
                const item = JSON.parse(itemStr);
                if (item.expiry && Date.now() > item.expiry) {
                    localStorage.removeItem(key);
                    return null;
                }
                return item.value;
            },
            remove: function(key) {
                localStorage.removeItem(key);
            }
        };

        let clickedCopyButtons = new Set();
        let totalCopyButtons = 0;
        let idleTimer;

        // --- Modal Control ---
        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // --- ID Formatter Logic ---
        function autoFormat(el) {
            // Replace any whitespace/new line sequences with a single comma
            let val = el.value.replace(/\s+/g, ',');
            // Remove leading/trailing commas
            el.value = val.replace(/^,|,$/g, '');
        }

        function copyFormatterResult() {
            const el = document.getElementById('formatterInput');
            navigator.clipboard.writeText(el.value).then(() => {
                alert("Formatted IDs copied!");
            });
        }

        // --- Cooldown Logic ---
        function startWaitingCountdown(seconds) {
            let overlay = document.getElementById("waitingOverlay");
            overlay.style.display = "flex";
            let t = Math.ceil(seconds);
            let int = setInterval(() => {
                overlay.innerText = "System Cool-down active. \n\n" + t + "s remaining";
                t--;
                if (t < 0) {
                    clearInterval(int);
                    Storage.remove("ComparatorWait");
                    location.reload();
                }
            }, 1000);
        }

        function checkCode() {
            let val = document.getElementById("codeInput").value;
            if (val === "LEWSOR") {
                Storage.remove("ComparatorWait");
                Storage.set("ComparatorBypass", "true", 86400);
                alert("Bypass enabled for 24h!");
                location.reload();
            } else {
                alert("Invalid code");
            }
        }

        function triggerCooldown() {
            if (!Storage.get("ComparatorBypass")) {
                setTimeout(() => {
                    Storage.set("ComparatorWait", Date.now() + (60 * 1000), 60);
                    location.reload();
                }, 5000);
            }
        }

        function triggerReset() {
            if (!Storage.get("ComparatorBypass")) {
                triggerCooldown();
            } else {
                location.reload();
            }
        }

        function handleCopyClick(btn, id, text) {
            navigator.clipboard.writeText(text).then(() => {
                const old = btn.innerText;
                btn.innerText = "Copied!";
                btn.style.background = "#059669";
                clickedCopyButtons.add(id);

                if (clickedCopyButtons.size >= totalCopyButtons && totalCopyButtons > 0) {
                    if (!Storage.get("ComparatorBypass")) triggerCooldown();
                }
                setTimeout(() => {
                    btn.innerText = old;
                    btn.style.background = "";
                }, 1500);
            });
        }

        function copyAllResults() {
            const text = document.getElementById('output').innerText.replace(/Copied!/g, "");
            navigator.clipboard.writeText(text).then(() => alert("All results copied!"));
        }

        // --- Comparison Logic ---
        async function readFiles(fileList) {
            return Promise.all([...fileList].map(file => file.text()));
        }

        function getCleanBusinessContent(text) {
            return text.replace(/<B2BEHeader>[\s\S]*?<\/B2BEHeader>/gi, "").trim();
        }

        function extractPrimaryID(text) {
            try {
                const match = text.match(/<DocID>(.*?)<\/DocID>/i) || text.match(/<PrimaryID>(.*?)<\/PrimaryID>/i);
                return match ? match[1].trim() : null;
            } catch (e) {
                return null;
            }
        }

        function getXMLValidationError(text) {
            const clean = getCleanBusinessContent(text);
            if (!clean.includes('<')) return "File does not contain XML tags.";
            const parser = new DOMParser();
            const doc = parser.parseFromString(clean, "text/xml");
            const parserError = doc.getElementsByTagName("parsererror")[0];
            return parserError ? parserError.textContent.split('Below is')[0] : null;
        }

        function getJSONValidationError(text) {
            const clean = getCleanBusinessContent(text);
            if (!clean.startsWith('{') && !clean.startsWith('[')) return "File does not start with JSON notation.";
            try {
                JSON.parse(clean);
                return null;
            } catch (e) {
                return e.message;
            }
        }

        function getEDIValidationError(text) {
            const clean = getCleanBusinessContent(text);
            if (!clean.includes("'") && !clean.includes("+")) return "Missing EDIFACT delimiters.";
            return null;
        }

        async function processFiles() {
            const output = document.getElementById('output');
            output.innerHTML = 'Analyzing...';
            clickedCopyButtons.clear();
            totalCopyButtons = 0;
            clearTimeout(idleTimer);

            if (!Storage.get("ComparatorBypass")) {
                idleTimer = setTimeout(() => triggerCooldown(), 120000);
            }

            try {
                const prodFiles = document.getElementById('prodFiles').files;
                const testFiles = document.getElementById('testFiles').files;
                const mode = document.getElementById('mode').value;

                if (!prodFiles.length || !testFiles.length) {
                    alert('Select both sets.');
                    output.innerHTML = "Results will appear here...";
                    return;
                }

                const [prodRaw, testRaw] = await Promise.all([readFiles(prodFiles), readFiles(testFiles)]);
                const prodMap = {},
                    testMap = {};

                for (let i = 0; i < prodRaw.length; i++) {
                    const content = prodRaw[i];
                    if (mode !== 'line') {
                        let err = (mode === 'xml') ? getXMLValidationError(content) : (mode === 'json' ? getJSONValidationError(content) : getEDIValidationError(content));
                        if (err) {
                            alert(`PROD Error [${prodFiles[i].name}]:\n${err}`);
                            return;
                        }
                    }
                    prodMap[extractPrimaryID(content) || `P_${i}`] = content;
                }

                for (let i = 0; i < testRaw.length; i++) {
                    const content = testRaw[i];
                    if (mode !== 'line') {
                        let err = (mode === 'xml') ? getXMLValidationError(content) : (mode === 'json' ? getJSONValidationError(content) : getEDIValidationError(content));
                        if (err) {
                            alert(`TEST Error [${testFiles[i].name}]:\n${err}`);
                            return;
                        }
                    }
                    testMap[extractPrimaryID(content) || `T_${i}`] = content;
                }

                const allKeys = new Set([...Object.keys(prodMap), ...Object.keys(testMap)]);
                let finalHtml = '',
                    orphansHtml = '';

                allKeys.forEach(id => {
                    if (prodMap[id] && testMap[id]) {
                        const diffData = compare(prodMap[id], testMap[id], mode);
                        if (diffData && diffData.trim() !== "") {
                            totalCopyButtons++;
                            finalHtml += `
                                <div class="diff-group">
                                    <div class="diff-path-container">
                                        <span class="diff-path">DOCUMENT ID: ${id}</span>
                                        <button onclick="handleCopyClick(this, '${id}', document.getElementById('text-${id}').innerText)">Copy ID Diff</button>
                                    </div>
                                    <div id="text-${id}">${diffData}</div>
                                </div>`;
                        }
                    } else if (prodMap[id]) {
                        orphansHtml += `<div class="orphan-notice">⚠️ NO MATCH: [${id}] PROD only.</div>`;
                    } else if (testMap[id]) {
                        orphansHtml += `<div class="orphan-notice" style="color: #4ade80; border-color: rgba(74, 222, 128, 0.2);">ℹ️ EXTRA: [${id}] TEST only.</div>`;
                    }
                });

                output.innerHTML = (orphansHtml + finalHtml) || "No differences detected.";
                if (totalCopyButtons === 0 && !orphansHtml) clearTimeout(idleTimer);

            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        function compare(a, b, mode) {
            const cleanA = getCleanBusinessContent(a),
                cleanB = getCleanBusinessContent(b);
            switch (mode) {
                case 'xml':
                    return compareXML(cleanA, cleanB);
                case 'line':
                    return compareLine(cleanA, cleanB);
                case 'json':
                    return compareJSON(cleanA, cleanB);
                case 'edi':
                    return compareEDI(cleanA, cleanB);
                default:
                    return '';
            }
        }

        function compareLine(a, b) {
            const aLines = a.split(/\r?\n/),
                bLines = b.split(/\r?\n/);
            let out = '';
            for (let i = 0; i < Math.max(aLines.length, bLines.length); i++) {
                if (aLines[i] !== bLines[i]) {
                    out += `Line ${i + 1}:\n<span class="diff-remove">PROD: ${escapeHtml(aLines[i] || '[EOF]')}</span><span class="diff-add">TEST: ${escapeHtml(bLines[i] || '[EOF]')}</span>\n`;
                }
            }
            return out;
        }

        function compareXML(a, b) {
            const parser = new DOMParser();
            const xmlA = parser.parseFromString(a, "text/xml"),
                xmlB = parser.parseFromString(b, "text/xml");

            function traverse(nA, nB, path = '') {
                let out = '';
                const curr = path + '/' + nA.nodeName;
                if (!nA.children.length && !nB.children.length && nA.textContent.trim() !== nB.textContent.trim()) {
                    out += `Node: ${curr}\n<span class="diff-remove">PROD: ${escapeHtml(nA.textContent.trim())}</span><span class="diff-add">TEST: ${escapeHtml(nB.textContent.trim())}</span>\n`;
                }
                for (let i = 0; i < Math.max(nA.children.length, nB.children.length); i++) {
                    if (nA.children[i] && nB.children[i]) out += traverse(nA.children[i], nB.children[i], curr);
                    else if (nA.children[i]) out += `<span class="diff-remove">Removed: ${curr}/${nA.children[i].nodeName}</span>\n`;
                    else if (nB.children[i]) out += `<span class="diff-add">Added: ${curr}/${nB.children[i].nodeName}</span>\n`;
                }
                return out;
            }
            return traverse(xmlA.documentElement, xmlB.documentElement);
        }

        function compareJSON(a, b) {
            try {
                const objA = JSON.parse(a),
                    objB = JSON.parse(b);

                function findDiff(o1, o2, path = 'root') {
                    let out = '';
                    const keys = new Set([...Object.keys(o1 || {}), ...Object.keys(o2 || {})]);
                    keys.forEach(k => {
                        const curr = `${path}.${k}`;
                        if (typeof o1[k] === 'object' && typeof o2[k] === 'object' && o1[k] && o2[k]) out += findDiff(o1[k], o2[k], curr);
                        else if (JSON.stringify(o1[k]) !== JSON.stringify(o2[k])) {
                            out += `Path: ${curr}\n<span class="diff-remove">PROD: ${JSON.stringify(o1[k])}</span><span class="diff-add">TEST: ${JSON.stringify(o2[k])}</span>\n`;
                        }
                    });
                    return out;
                }
                return findDiff(objA, objB);
            } catch (e) {
                return "JSON Data Error";
            }
        }

        function compareEDI(a, b) {
            const sA = a.split("'").map(s => s.trim()).filter(s => s);
            const sB = b.split("'").map(s => s.trim()).filter(s => s);
            let out = '';
            for (let i = 0; i < Math.max(sA.length, sB.length); i++) {
                if (sA[i] !== sB[i]) {
                    const segPartsA = sA[i] ? sA[i].split('+') : [],
                        segPartsB = sB[i] ? sB[i].split('+') : [];
                    let segID = (segPartsA[0] || segPartsB[0]) + (segPartsA[1] ? "+" + segPartsA[1] : "");
                    out += `Segment : ${segID}\n<span class="diff-remove">PROD: ${escapeHtml(sA[i] ? sA[i] + "'" : '[Missing]')}</span><span class="diff-add">TEST: ${escapeHtml(sB[i] ? sB[i] + "'" : '[Missing]')}</span>\n`;
                }
            }
            return out;
        }

        function escapeHtml(s) {
            return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        window.addEventListener("load", function() {
            let clicks = 0,
                timer;
            document.getElementById("title").addEventListener("click", () => {
                clicks++;
                clearTimeout(timer);
                timer = setTimeout(() => clicks = 0, 1000);
                if (clicks === 3) {
                    openModal('codeModal');
                    clicks = 0;
                }
            });

            let waitData = Storage.get("ComparatorWait");
            if (waitData && !Storage.get("ComparatorBypass")) {
                let remaining = Math.floor((parseInt(waitData) - Date.now()) / 1000);
                if (remaining > 0) startWaitingCountdown(remaining);
                else Storage.remove("ComparatorWait");
            }
        });
    </script>
</body>

</html>
