<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>XML Segment Compare</title>
    <style>
         :root {
            --bg: #071025;
            --panel: #0b1220;
            --accent: #7dd3fc;
            --border: rgba(255, 255, 255, 0.1);
            --text: #e6eef6;
            --danger: #fca5a5;
            --success: #86efac;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            line-height: 1.5;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--panel);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            font-size: 20px;
            color: var(--accent);
            margin-top: 0;
        }
        
        .editors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        textarea {
            width: 100%;
            height: 300px;
            background: #020617;
            color: #94a3b8;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            box-sizing: border-box;
            resize: vertical;
        }
        
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        
        .btn-compare {
            background: linear-gradient(180deg, #006a7a, #007b8f);
            color: white;
        }
        
        .btn-copy {
            background: #10b981;
            color: white;
            visibility: hidden;
        }
        
        button:hover {
            filter: brightness(1.2);
        }
        
        #result {
            background: #020617;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
        }
        
        .diff-row {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .path {
            color: var(--accent);
            font-family: monospace;
            font-size: 12px;
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .val-line {
            font-family: monospace;
            font-size: 13px;
            display: block;
        }
        
        .before {
            color: var(--danger);
        }
        
        .after {
            color: var(--success);
        }
        
        .empty {
            opacity: 0.4;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>XML Segment Compare</h1>

        <div class="editors">
            <textarea id="xml1" placeholder="Paste XML BEFORE..."></textarea>
            <textarea id="xml2" placeholder="Paste XML AFTER..."></textarea>
        </div>

        <div class="actions">
            <button class="btn-compare" onclick="doCompare()">Compare Now</button>
            <button id="copyBtn" class="btn-copy" onclick="copyResults()">Copy Differences</button>
        </div>

        <div id="result">Paste your XML and click Compare.</div>
    </div>

    <script>
        function flattenXML(raw) {
            // 1. Clean Headers and B2BE wrappers
            let str = raw.replace(/<\?xml.*?\?>/gi, "");
            str = str.replace(/<B2BEHeader[\s\S]*?<\/B2BEHeader>/gi, "");
            str = str.replace(/<\/?B2BEXML[^>]*>/gi, "");

            const map = {};
            const stack = [];
            const counts = {};

            // 2. Regex to find tags and text content
            // Matches: <TagName attrs> or </TagName> or TextContent
            const regex = /(<([^> \/]+)[^>]*>)|(<\/([^>]+)>)|([^<]+)/g;
            let match;

            while ((match = regex.exec(str)) !== null) {
                if (match[1] && !match[1].includes('/>')) {
                    // Opening Tag
                    const tagName = match[2];
                    stack.push(tagName);
                    const path = stack.join('/');
                    counts[path] = (counts[path] || 0) + 1;
                    stack[stack.length - 1] = `${tagName}[${counts[path]}]`;
                } else if (match[3]) {
                    // Closing Tag
                    stack.pop();
                } else if (match[5]) {
                    // Text Content
                    const text = match[5].trim();
                    if (text) {
                        const currentPath = stack.join('/');
                        map[currentPath] = text;
                    }
                }
            }
            return map;
        }

        function doCompare() {
            const val1 = document.getElementById('xml1').value;
            const val2 = document.getElementById('xml2').value;

            const map1 = flattenXML(val1);
            const map2 = flattenXML(val2);

            const allPaths = new Set([...Object.keys(map1), ...Object.keys(map2)]);
            let html = "";
            let count = 0;

            Array.from(allPaths).sort().forEach(path => {
                const v1 = map1[path];
                const v2 = map2[path];

                if (v1 !== v2) {
                    count++;
                    html += `
                <div class="diff-row">
                    <span class="path">${path}</span>
                    <span class="val-line before"><strong>BEFORE:</strong> ${v1 || '<span class="empty">(missing)</span>'}</span>
                    <span class="val-line after"><strong>AFTER :</strong> ${v2 || '<span class="empty">(missing)</span>'}</span>
                </div>`;
                }
            });

            const resDiv = document.getElementById('result');
            const copyBtn = document.getElementById('copyBtn');

            if (count === 0) {
                resDiv.innerHTML = "✅ No differences found in the XML segments.";
                copyBtn.style.visibility = "hidden";
            } else {
                resDiv.innerHTML = html;
                copyBtn.style.visibility = "visible";
            }
        }

        function copyResults() {
            const text = document.getElementById('result').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                const oldText = btn.innerText;
                btn.innerText = "Copied!";
                setTimeout(() => btn.innerText = oldText, 2000);
            });
        }
    </script>

</body>

</html>
